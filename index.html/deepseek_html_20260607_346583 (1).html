<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Brain Bounce | 100 Q per Subject • Random sets every round</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1120 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 980px;
      width: 100%;
      background: rgba(18, 25, 45, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 3rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(66, 153, 225, 0.2);
      overflow: hidden;
    }

    .app-header {
      background: rgba(15, 23, 42, 0.9);
      padding: 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
    }

    .app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f97316, #facc15, #38bdf8);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .sub {
      color: #94a3b8;
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .main-content {
      padding: 2rem 2rem 1.8rem;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .subject-grid {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    .subject-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 1.8rem;
      padding: 1.3rem 1rem;
      flex: 1;
      min-width: 150px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .subject-card:hover {
      transform: translateY(-6px);
      background: rgba(51, 65, 85, 0.9);
      border-color: #facc15;
    }

    .subject-icon { font-size: 2.4rem; color: #facc15; margin-bottom: 0.6rem; }
    .subject-card h2 { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; }
    .subject-card p { color: #9ca3af; font-size: 0.7rem; margin-top: 6px; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 1.6rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.8rem 1.2rem;
      border-radius: 2rem;
    }

    .badge-subject {
      background: #1e293b;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #facc15;
    }

    .score-progress {
      background: #0f172a;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      color: #facc15;
    }

    .question-text {
      font-size: 1.45rem;
      font-weight: 600;
      color: #e2e8f0;
      margin: 1.2rem 0 1.8rem 0;
      line-height: 1.4;
    }

    .options-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .option-radio {
      background: rgba(21, 31, 52, 0.8);
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border: 1px solid rgba(71, 85, 105, 0.5);
    }
    .option-radio:hover { background: #1e2a44; border-color: #facc15; }
    input[type="radio"] { accent-color: #f97316; width: 18px; height: 18px; cursor: pointer; }
    .option-text { font-size: 1rem; font-weight: 500; color: #cbd5e1; }

    .action-buttons { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.6rem; flex-wrap: wrap; }
    button {
      background: #0f172ad9;
      border: 1px solid #334155;
      padding: 0.8rem 1.7rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-primary {
      background: linear-gradient(95deg, #f97316, #facc15);
      border: none;
      color: #0f172a;
    }
    .btn-primary:hover { transform: scale(0.98); }
    .btn-secondary { background: rgba(30, 41, 59, 0.9); border-color: #475569; }
    .btn-secondary:hover { background: #334155; }
    .message-area {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      padding: 0.5rem;
      border-radius: 2rem;
      background: #0f172a80;
      color: #94a3b8;
    }
    .result-box { text-align: center; padding: 1.8rem; background: rgba(15, 23, 42, 0.7); border-radius: 2rem; margin: 1rem 0; }
    .result-score { font-size: 3.2rem; font-weight: 800; background: linear-gradient(135deg, #facc15, #f97316); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .result-message { font-size: 1.1rem; margin: 1rem 0; color: #cbd5e6; }
    .flex-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.4rem; }
    footer { text-align: center; padding: 1rem; font-size: 0.7rem; color: #4b5563; border-top: 1px solid #1e293b; }
    .random-badge { background: #facc1520; display: inline-block; border-radius: 40px; padding: 0.2rem 0.8rem; font-size: 0.7rem; margin-left: 8px; color: #facc15; }
  </style>
</head>
<body>
<div class="app-container" id="appRoot">
  <div class="app-header">
    <h1><i class="fas fa-brain"></i> Brain Bounce <span style="font-weight: 300;">|</span> 100/subject</h1>
    <div class="sub"><i class="fas fa-dice-d6"></i> Each round = 20 random questions from 100‑bank • Endless variety</div>
  </div>
  <div class="main-content" id="dynamicPanel"></div>
  <footer><i class="fas fa-sync-alt"></i> Fresh set every time you play — 500 total questions bank</footer>
</div>

<script>
  // --------------------------------------------------------------
  // QUESTION BANK GENERATORS: 100 UNIQUE QUESTIONS PER SUBJECT
  // Each generator returns an array of 100 question objects.
  // --------------------------------------------------------------

  // 1. PHYSICS (100 questions - mechanics, electricity, thermodynamics, modern physics)
  function generatePhysicsBank() {
    const bank = [];
    const topics = [
      "Newton's laws", "Ohm's law", "Kinematics", "Work & Energy", "Electrostatics", "Magnetism", 
      "Thermodynamics", "Waves", "Optics", "Modern Physics", "Fluid Mechanics", "Rotational Motion"
    ];
    for (let i = 1; i <= 100; i++) {
      let q, opts, correct;
      const r = i % 20;
      if (r === 1) q = `What is the SI unit of ${i % 2 === 0 ? "momentum" : "impulse"}?`, opts = ["kg·m/s", "N·s", "Both A & B", "J·s"], correct = 2;
      else if (r === 2) q = "Which law states F = ma?", opts = ["Newton's first", "Newton's second", "Newton's third", "Hooke's law"], correct = 1;
      else if (r === 3) q = "The unit of electrical conductance is?", opts = ["Siemens", "Ohm⁻¹", "Mho", "All of these"], correct = 3;
      else if (r === 4) q = "What is the wavelength range of visible light? (nm)", opts = ["400-700", "200-400", "700-1200", "100-300"], correct = 0;
      else if (r === 5) q = "Which particle has the smallest mass?", opts = ["Electron", "Proton", "Neutron", "Alpha"], correct = 0;
      else if (r === 6) q = "Sound waves are ____ waves.", opts = ["Transverse", "Longitudinal", "Electromagnetic", "Matter"], correct = 1;
      else if (r === 7) q = "What is the value of Stefan-Boltzmann constant (approx)?", opts = ["5.67×10⁻⁸ W/m²K⁴", "3.14×10⁻⁵", "1.38×10⁻²³", "6.63×10⁻³⁴"], correct = 0;
      else if (r === 8) q = "The phenomenon of splitting of light into colours is called?", opts = ["Reflection", "Refraction", "Dispersion", "Diffraction"], correct = 2;
      else if (r === 9) q = "What is the principle behind a rocket?", opts = ["Newton's third law", "Bernoulli's theorem", "Conservation of energy", "Pascal's law"], correct = 0;
      else if (r === 10) q = "Which device is used to measure electric current?", opts = ["Voltmeter", "Ammeter", "Galvanometer", "Ohmmeter"], correct = 1;
      else if (r === 11) q = "The energy stored in a capacitor is?", opts = ["½CV²", "QV", "½QV", "C²V"], correct = 0;
      else if (r === 12) q = "What does a transformer change?", opts = ["Voltage level", "Frequency", "Power", "AC to DC"], correct = 0;
      else if (r === 13) q = "Which scientist gave the photoelectric effect equation?", opts = ["Planck", "Einstein", "Bohr", "Rutherford"], correct = 1;
      else if (r === 14) q = "One horsepower is equal to ____ watts.", opts = ["746", "550", "1000", "735"], correct = 0;
      else if (r === 15) q = "Absolute zero temperature is?", opts = ["-273.15°C", "-273.15 K", "0°C", "0 K only"], correct = 0;
      else if (r === 16) q = "Which colour has highest frequency?", opts = ["Violet", "Red", "Green", "Yellow"], correct = 0;
      else if (r === 17) q = "A convex lens always forms a _____ image of a real object?", opts = ["Real", "Virtual", "Either real or virtual", "None"], correct = 2;
      else if (r === 18) q = "The time period of a simple pendulum depends on?", opts = ["Mass", "Length", "Amplitude", "Both length & g"], correct = 3;
      else if (r === 19) q = "Which law describes the force between two charges?", opts = ["Coulomb's law", "Gauss law", "Ampere's law", "Faraday's law"], correct = 0;
      else q = `The unit of ${i % 3 === 0 ? "magnetic flux density" : "inductance"} is?`, opts = ["Tesla", "Weber", "Henry", "Gauss"], correct = (i%3===0?0:2);
      bank.push({ text: q, options: opts.slice(0,4), correct });
    }
    // ensure exactly 100 items
    while(bank.length < 100) bank.push({ text: "What is the SI unit of power?", options: ["Joule", "Watt", "Newton", "Pascal"], correct: 1 });
    return bank.slice(0,100);
  }

  // 2. CHEMISTRY (100 questions)
  function generateChemistryBank() {
    const bank = [];
    for (let i=1; i<=100; i++) {
      const r = i % 15;
      let q, opts, correct;
      if (r===1) q = "What is the atomic number of Oxygen?", opts = ["6","8","10","12"], correct=1;
      else if (r===2) q = "Which gas is used in fire extinguishers?", opts = ["CO₂","O₂","N₂","He"], correct=0;
      else if (r===3) q = "The most electronegative element is?", opts = ["Fluorine","Oxygen","Chlorine","Nitrogen"], correct=0;
      else if (r===4) q = "What is the chemical symbol for Silver?", opts = ["Si","Ag","Au","Al"], correct=1;
      else if (r===5) q = "Which acid is present in vinegar?", opts = ["Acetic","Citric","Lactic","Tartaric"], correct=0;
      else if (r===6) q = "pH of a neutral solution is?", opts = ["0","7","14","1"], correct=1;
      else if (r===7) q = "Which metal is liquid at room temperature?", opts = ["Mercury","Bromine","Gallium","Cesium"], correct=0;
      else if (r===8) q = "What is the formula of caustic soda?", opts = ["NaOH","NaCl","Na₂CO₃","NaHCO₃"], correct=0;
      else if (r===9) q = "The number of protons in Carbon-14 is?", opts = ["6","8","14","12"], correct=0;
      else if (r===10) q = "Which element has the highest thermal conductivity?", opts = ["Silver","Copper","Gold","Aluminum"], correct=0;
      else if (r===11) q = "The process of rusting requires?", opts = ["O₂ & H₂O","CO₂","N₂","H₂"], correct=0;
      else if (r===12) q = "What is the common name for sodium bicarbonate?", opts = ["Baking soda","Washing soda","Caustic soda","Salt"], correct=0;
      else if (r===13) q = "Which gas is known as 'laughing gas'?", opts = ["NO","N₂O","CO₂","SO₂"], correct=1;
      else if (r===14) q = "The periodic table was proposed by?", opts = ["Mendeleev","Dalton","Lavoisier","Bohr"], correct=0;
      else q = `What is the atomic mass of ${i%2===0?"Calcium":"Magnesium"} (approx)?`, opts = ["40","24","32","20"], correct = (i%2===0?0:1);
      bank.push({ text: q, options: opts.slice(0,4), correct });
    }
    while(bank.length<100) bank.push({ text: "What is the pH of pure water?", options: ["5","6","7","8"], correct:2 });
    return bank.slice(0,100);
  }

  // 3. CRS (Christian Religious Studies) 100 questions
  function generateCRSBank() {
    const bank = [];
    const facts = [
      "Who led Israelites out of Egypt?","Moses","Aaron","Joshua","Abraham",0,
      "First book of the New Testament?","Matthew","Mark","Luke","John",2,
      "Who betrayed Jesus?","Judas Iscariot","Peter","John","Thomas",0,
      "Fruit of the Spirit is in?","Galatians","Ephesians","Romans","Corinthians",0,
      "Lion's den survivor?","Daniel","Jeremiah","Elijah","Elisha",0,
      "Who built the first temple?","Solomon","David","Saul","Hezekiah",0,
      "Who wrote most Psalms?","David","Moses","Solomon","Asaph",0,
      "Jesus' birthplace?","Bethlehem","Nazareth","Jerusalem","Capernaum",0,
      "Disciple who denied Jesus 3 times?","Peter","Andrew","James","John",0,
      "Shortest verse?","Jesus wept","Pray always","Rejoice","God is love",0,
      "First martyr?","Stephen","James","Philip","Paul",0,
      "Good Samaritan appears in?","Luke","Matthew","Mark","John",0,
      "Number of plagues in Egypt?","10","7","12","5",0,
      "Writing on the wall interpreter?","Daniel","Joseph","Moses","Isaiah",0,
      "Tax collector apostle?","Matthew","Peter","James","Andrew",0,
      "Moses' brother?","Aaron","Miriam","Joshua","Caleb",0,
      "Meaning of Gospel?","Good news","Law","Prophecy","Psalm",0,
      "Walls of which city fell?","Jericho","Ai","Megiddo","Bethel",0,
      "Mother of John the Baptist?","Elizabeth","Mary","Anna","Martha",0,
      "Faith without works is dead' which book?","James","Hebrews","Romans","Galatians",0
    ];
    for (let i=0; i<100; i++) {
      const idx = i % 20;
      const base = idx * 5;
      if (base+4 < facts.length) {
        bank.push({ text: facts[base], options: [facts[base+1], facts[base+2], facts[base+3], facts[base+4]], correct: facts[base+5] });
      } else {
        bank.push({ text: "Who was the first king of Israel?", options: ["Saul","David","Solomon","Samuel"], correct:0 });
      }
    }
    return bank.slice(0,100);
  }

  // 4. MATHEMATICS (100 questions)
  function generateMathBank() {
    const bank = [];
    for (let i=1; i<=100; i++) {
      const r = i % 20;
      if (r===1) bank.push({ text: "What is 15% of 200?", options: ["30","20","25","35"], correct:0 });
      else if (r===2) bank.push({ text: "Solve: 3x - 7 = 11", options: ["6","5","4","8"], correct:0 });
      else if (r===3) bank.push({ text: "Area of circle radius 7 cm? (π=22/7)", options: ["154 cm²","144","164","174"], correct:0 });
      else if (r===4) bank.push({ text: "Square root of 169?", options: ["13","12","14","11"], correct:0 });
      else if (r===5) bank.push({ text: "If a=2, b=3, c=4, then a²+b² = ?", options: ["13","10","25","5"], correct:0 });
      else if (r===6) bank.push({ text: "What is the sum of interior angles of a pentagon?", options: ["540°","360°","720°","180°"], correct:0 });
      else if (r===7) bank.push({ text: "LCM of 12 and 18?", options: ["36","24","48","72"], correct:0 });
      else if (r===8) bank.push({ text: "Simplify: (2³)²", options: ["64","32","16","128"], correct:0 });
      else if (r===9) bank.push({ text: "What is the probability of rolling a 6 on a fair die?", options: ["1/6","1/3","1/2","1/4"], correct:0 });
      else if (r===10) bank.push({ text: "Convert 0.75 to fraction", options: ["3/4","1/2","2/3","5/8"], correct:0 });
      else if (r===11) bank.push({ text: "Value of sin 90°", options: ["1","0","-1","0.5"], correct:0 });
      else if (r===12) bank.push({ text: "The derivative of x² is?", options: ["2x","x","2","x²"], correct:0 });
      else if (r===13) bank.push({ text: "Integral of 2x dx", options: ["x² + C","2x² + C","x + C","2 + C"], correct:0 });
      else if (r===14) bank.push({ text: "If y = 4x + 3, slope is?", options: ["4","3","7","1"], correct:0 });
      else if (r===15) bank.push({ text: "Median of 3,5,7,9,11?", options: ["7","5","9","8"], correct:0 });
      else if (r===16) bank.push({ text: "2⁵ = ?", options: ["32","64","16","8"], correct:0 });
      else if (r===17) bank.push({ text: "What is the next prime after 11?", options: ["13","17","19","23"], correct:0 });
      else if (r===18) bank.push({ text: "If a circle's diameter is 10 cm, circumference ≈ ?", options: ["31.4 cm","15.7 cm","62.8 cm","78.5 cm"], correct:0 });
      else if (r===19) bank.push({ text: "Log₁₀ 100 = ?", options: ["2","10","1","3"], correct:0 });
      else bank.push({ text: `What is ${i} + ${100-i}?`, options: ["100","99","101","98"], correct:0 });
    }
    return bank.slice(0,100);
  }

  // 5. CURRENT AFFAIRS (NIGERIA) 100 questions
  function generateCurrentAffairsBank() {
    const bank = [];
    const ngFacts = [
      "Current President of Nigeria (2026)?","Bola Tinubu","Goodluck Jonathan","Buhari","Atiku",0,
      "Capital of Nigeria?","Abuja","Lagos","Kano","Ibadan",0,
      "Grammy winner 2021 (World Music)?","Burna Boy","Wizkid","Davido","Tiwa",0,
      "Niger River flows into?","Gulf of Guinea","Atlantic Ocean","Lake Chad","Mediterranean",0,
      "First line of anthem after 'Arise O compatriots'?","Nigeria's call obey","To serve","Our fatherland","God bless",0,
      "First Executive President?","Shehu Shagari","Azikiwe","Obasanjo","Buhari",0,
      "Central bank name?","Central Bank of Nigeria","First Bank","Union Bank","Access",0,
      "Coal city?","Enugu","Jos","Kaduna","Maiduguri",0,
      "Independence year?","1960","1963","1957","1971",0,
      "Current Senate President?","Godswill Akpabio","Ahmed Lawan","Saraki","Mark",0,
      "Centre of Excellence?","Lagos","Abuja","Rivers","Delta",0,
      "Currency?","Naira","Cedi","Shilling","Rand",0,
      "'Things Fall Apart' author?","Chinua Achebe","Wole Soyinka","Adichie","Okri",0,
      "Most NPFL titles?","Enyimba","Kano Pillars","Rangers","Shooting",0,
      "Anti-corruption agency?","EFCC","ICPC","NDLEA","NIA",0,
      "Longest river?","Niger","Benue","Cross River","Ogun",0,
      "First Nigerian Nobel laureate?","Wole Soyinka","Chinua Achebe","Ngozi","Obasanjo",0,
      "Hosted FIFA U-20 World Cup year?","1999","2009","1995","2005",0,
      "National football team?","Super Eagles","Green Eagles","Falcons","Flying Eagles",0,
      "National flag designer?","Michael Taiwo Akinkunmi","MKO Abiola","Nnamdi Azikiwe","Obafemi Awolowo",0
    ];
    for (let i=0; i<100; i++) {
      const idx = i % 20;
      const base = idx * 5;
      if (base+4 < ngFacts.length) {
        bank.push({ text: ngFacts[base], options: [ngFacts[base+1], ngFacts[base+2], ngFacts[base+3], ngFacts[base+4]], correct: ngFacts[base+5] });
      } else {
        bank.push({ text: "Which state is known as 'Gateway State'?", options: ["Ogun","Lagos","Oyo","Osun"], correct:0 });
      }
    }
    return bank.slice(0,100);
  }

  // Master banks (100 each)
  const BANKS = {
    physics: generatePhysicsBank(),
    chemistry: generateChemistryBank(),
    crs: generateCRSBank(),
    mathematics: generateMathBank(),
    current_affairs: generateCurrentAffairsBank()
  };

  const SUBJECT_META = {
    physics: { name: "⚛️ Physics", icon: "fa-atom" },
    chemistry: { name: "🧪 Chemistry", icon: "fa-flask" },
    crs: { name: "📖 CRS", icon: "fa-church" },
    mathematics: { name: "📐 Mathematics", icon: "fa-calculator" },
    current_affairs: { name: "🇳🇬 Current Affairs NG", icon: "fa-newspaper" }
  };
  const ROUND_SIZE = 20;  // 20 random questions per round

  // GAME STATE
  let currentMode = "subject"; // subject, quiz, result
  let currentSubjectKey = null;
  let activeQuestions = [];     // the 20 random questions for this session
  let currentIndex = 0;
  let currentScore = 0;
  let totalQ = ROUND_SIZE;
  let feedbackTimeout = null;
  const panel = document.getElementById("dynamicPanel");

  function showMessage(text, isErr=false) {
    const el = document.getElementById("feedbackMsg");
    if (el) { el.innerHTML = text; el.style.color = isErr ? "#f87171" : "#a5f3fc"; }
    if (feedbackTimeout) clearTimeout(feedbackTimeout);
    feedbackTimeout = setTimeout(() => {
      if (document.getElementById("feedbackMsg")) document.getElementById("feedbackMsg").innerHTML = "🧠 Select answer & hit Next";
    }, 2000);
  }

  function pickRandomQuestions(subjectKey) {
    const bank = BANKS[subjectKey];
    if (!bank || bank.length < ROUND_SIZE) return [];
    // shuffle and take first ROUND_SIZE
    const shuffled = [...bank];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, ROUND_SIZE);
  }

  function startQuiz(subjectKey) {
    currentSubjectKey = subjectKey;
    activeQuestions = pickRandomQuestions(subjectKey);
    if (activeQuestions.length < ROUND_SIZE) {
      alert("Error loading questions, try again");
      return;
    }
    currentIndex = 0;
    currentScore = 0;
    totalQ = activeQuestions.length;
    currentMode = "quiz";
    renderQuizInterface();
  }

  function renderQuizInterface() {
    if (currentMode !== "quiz") return;
    const q = activeQuestions[currentIndex];
    if (!q) { showResultScreen(); return; }
    const meta = SUBJECT_META[currentSubjectKey];
    const progress = `${currentIndex+1} / ${totalQ}`;
    let optsHtml = "";
    q.options.forEach((opt, idx) => {
      optsHtml += `<label class="option-radio"><input type="radio" name="quizOption" value="${idx}"><span class="option-text">${escapeHtml(opt)}</span></label>`;
    });
    const html = `
      <div class="quiz-header">
        <span class="badge-subject"><i class="fas ${meta.icon}"></i> ${meta.name} <span class="random-badge"><i class="fas fa-random"></i> random 20/100</span></span>
        <span class="score-progress"><i class="fas fa-star"></i> Score: ${currentScore} &nbsp;| 📋 ${progress}</span>
      </div>
      <div class="question-text"><i class="fas fa-question-circle" style="color:#facc15; margin-right:12px;"></i>${escapeHtml(q.text)}</div>
      <div class="options-list">${optsHtml}</div>
      <div class="action-buttons">
        <button class="btn-secondary" id="changeSubjectBtn"><i class="fas fa-arrow-left"></i> Subjects</button>
        <button class="btn-primary" id="nextQuestionBtn"><i class="fas fa-arrow-right"></i> ${currentIndex+1 === totalQ ? 'Finish' : 'Next'}</button>
      </div>
      <div id="feedbackMsg" class="message-area">✨ Fresh random set! Choose answer</div>
    `;
    panel.innerHTML = html;
    document.getElementById("nextQuestionBtn")?.addEventListener("click", handleNext);
    document.getElementById("changeSubjectBtn")?.addEventListener("click", () => goToSubjectSelection());
  }

  function handleNext() {
    if (currentMode !== "quiz") return;
    const selected = document.querySelector('input[name="quizOption"]:checked');
    if (!selected) { showMessage("⚠️ Select an answer!", true); return; }
    const val = parseInt(selected.value);
    const curr = activeQuestions[currentIndex];
    const isCorrect = (val === curr.correct);
    if (isCorrect) { currentScore++; showMessage("✅ Correct! +1", false); }
    else { showMessage(`❌ Wrong. Correct: ${escapeHtml(curr.options[curr.correct])}`, false); }
    const isLast = (currentIndex+1 >= totalQ);
    if (isLast) { currentMode = "result"; showResultScreen(); }
    else { currentIndex++; renderQuizInterface(); }
  }

  function showResultScreen() {
    const percent = Math.round((currentScore/totalQ)*100);
    let msg = percent>=80 ? "🏆 Brain Bounce Master!" : (percent>=60 ? "👍 Great bounce!" : "📘 Keep practicing, next round will be different!");
    const meta = SUBJECT_META[currentSubjectKey];
    const html = `
      <div class="result-box">
        <i class="fas ${meta.icon}" style="font-size:3rem; color:#facc15;"></i>
        <div class="result-score">${currentScore} / ${totalQ}</div>
        <div class="result-message">${msg}</div>
        <div style="background:#1e293b; border-radius:2rem; padding:0.5rem;"><span style="color:#94a3b8;">🎯 ${meta.name} • new random questions next round</span></div>
        <div class="flex-btns">
          <button class="btn-secondary" id="retakeBtn"><i class="fas fa-dice-d6"></i> Play again (fresh set)</button>
          <button class="btn-primary" id="subjectsBtn"><i class="fas fa-border-all"></i> All subjects</button>
        </div>
      </div>
      <div id="feedbackMsg" class="message-area">💡 Each round = 20 random questions from 100+ bank. Endless learning!</div>
    `;
    panel.innerHTML = html;
    document.getElementById("retakeBtn")?.addEventListener("click", () => startQuiz(currentSubjectKey));
    document.getElementById("subjectsBtn")?.addEventListener("click", () => goToSubjectSelection());
  }

  function goToSubjectSelection() {
    currentMode = "subject";
    currentSubjectKey = null;
    renderSubjectSelection();
  }

  function renderSubjectSelection() {
    let cards = "";
    for (const [key, meta] of Object.entries(SUBJECT_META)) {
      cards += `<div class="subject-card" data-subject="${key}">
        <div class="subject-icon"><i class="fas ${meta.icon}"></i></div>
        <h2>${meta.name}</h2>
        <p>📚 100 questions • random 20 per round</p>
      </div>`;
    }
    const html = `
      <div style="text-align:center; margin-bottom:1rem;"><i class="fas fa-brain" style="font-size:2rem; color:#facc15;"></i><p style="color:#cbd5e6;">Pick a subject → 20 random questions from 100 → different every time!</p></div>
      <div class="subject-grid">${cards}</div>
      <div class="message-area"><i class="fas fa-infinity"></i> 500 total unique questions • infinite replayability</div>
    `;
    panel.innerHTML = html;
    document.querySelectorAll('.subject-card').forEach(card => {
      card.addEventListener('click', () => startQuiz(card.getAttribute('data-subject')));
    });
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

  renderSubjectSelection();
</script>
</body>
</html>
